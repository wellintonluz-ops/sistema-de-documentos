<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal SADP v3.0</title>
  
  <!-- Carregamento do Tailwind CSS para estilização moderna e responsiva -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            red: {
              750: '#b91c1c',
              850: '#991b1b',
            }
          }
        }
      }
    }
  </script>

  <!-- Carregamento do React e ReactDOM (Versão estável 18) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Carregamento do Babel Standalone para compilar JSX no próprio navegador de forma local -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Carregamento do SheetJS para leitura de planilhas (.xlsx/.xls/.csv) de cadastro de SKU -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase (SDK compat): login Google + banco de dados Firestore -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- Estilos CSS embutidos para garantir impressão perfeita em folhas físicas A4 -->
  <style>
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body, html {
        background-color: white !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      .print\:hidden {
        display: none !important;
      }
      .print\:block {
        display: block !important;
      }
      .print\:p-0 {
        padding: 0 !important;
      }
      /* Oculta toda a interface de navegação e botões mantendo apenas a folha A4 visível */
      #root > div > header,
      #root > div > div > aside,
      #root > div > div > main > div:nth-child(1),
      #root > div > div > main > div > div:nth-child(1) {
        display: none !important;
      }
      #root > div > div > main > div > div:nth-child(2) {
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
        width: 100% !important;
      }
      #root > div > div > main > div > div:nth-child(2) > div:nth-child(1) {
        display: none !important;
      }
      .print-document {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- Ponto de entrada onde o React irá renderizar o Portal -->
  <div id="root"></div>

  <!-- Script React compilado localmente em tempo de execução usando Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ===== FIREBASE: configuração, autenticação Google e Firestore =====
    const firebaseConfig = {
      apiKey: "AIzaSyBzKINkGuxpJZkRVz5zEK-lTYbpiSg__hI",
      authDomain: "sistema-de-documentos-6bd4a.firebaseapp.com",
      projectId: "sistema-de-documentos-6bd4a",
      storageBucket: "sistema-de-documentos-6bd4a.firebasestorage.app",
      messagingSenderId: "140795558757",
      appId: "1:140795558757:web:de9d7e67601a37d60cff8c",
      measurementId: "G-8N1J083QC8"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    db.settings({ ignoreUndefinedProperties: true });

    // Somente e-mails deste domínio entram no sistema (a regra também é aplicada no Firestore)
    const DOMINIO_PERMITIDO = "grupotbx.com.br";
    const COL_DOCUMENTOS = "sadp_documents";
    const COL_CONFIG = "sadp_config";

    const emailPermitido = (u) => !!(u && u.email && u.emailVerified && u.email.toLowerCase().endsWith("@" + DOMINIO_PERMITIDO));

    const avisarErroFirestore = (err) => {
      console.error(err);
      const motivo = err && err.code === 'permission-denied'
        ? "sem permissão. Confira as regras do Firestore e se você entrou com um e-mail @" + DOMINIO_PERMITIDO + "."
        : (err && err.message) || "erro desconhecido.";
      alert("Não foi possível salvar na nuvem: " + motivo);
    };

    // Dados que existiam no localStorage deste navegador (versão antiga do sistema)
    const IDS_DE_EXEMPLO = ["F-1024", "I-2011", "AZ-501", "AT-601"];
    const lerDadosLocais = () => {
      try {
        if (localStorage.getItem('sadp_migrado_firestore')) return null;
        const ler = (chave) => {
          const bruto = localStorage.getItem(chave);
          return bruto ? JSON.parse(bruto) : [];
        };
        const docs = ler('sadp_documents').filter(d => d && d.id && !IDS_DE_EXEMPLO.includes(d.id));
        const listas = {
          skus: ler('sadp_sku_list'),
          colaboradores: ler('sadp_colaborador_list'),
          transportadoras: ler('sadp_transportadora_list'),
          setores: ler('sadp_setor_list')
        };
        const total = docs.length + Object.values(listas).reduce((n, l) => n + l.length, 0);
        return total > 0 ? { docs, listas } : null;
      } catch (e) {
        return null;
      }
    };

    // Lista de cadastro (SKU, colaboradores...) sincronizada em tempo real com o Firestore.
    // Edições locais são enviadas com um pequeno atraso para não gravar a cada tecla digitada.
    function useListaSincronizada(nomeDoc, user) {
      const [lista, setListaLocal] = useState([]);
      const pendente = useRef(false);
      const versao = useRef(0);
      const timer = useRef(null);

      useEffect(() => {
        const ref = db.collection(COL_CONFIG).doc(nomeDoc);
        const cancelar = ref.onSnapshot(
          (snap) => {
            if (pendente.current) return;
            setListaLocal(snap.exists ? (snap.data().itens || []) : []);
          },
          (err) => console.error("Erro ao ler " + nomeDoc, err)
        );
        return cancelar;
      }, [nomeDoc]);

      const setLista = (novaLista) => {
        setListaLocal(novaLista);
        pendente.current = true;
        const minhaVersao = ++versao.current;
        clearTimeout(timer.current);
        timer.current = setTimeout(() => {
          const ref = db.collection(COL_CONFIG).doc(nomeDoc);
          ref.set({
            itens: novaLista,
            atualizadoPor: user.email,
            atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => {
            if (versao.current === minhaVersao) pendente.current = false;
          }).catch((err) => {
            pendente.current = false;
            avisarErroFirestore(err);
            ref.get().then(snap => setListaLocal(snap.exists ? (snap.data().itens || []) : []));
          });
        }, 600);
      };

      return [lista, setLista];
    }

    // Ícones em SVG inline de alta resolução
    const Icons = {
      ChevronDown: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>,
      ChevronUp: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" /></svg>,
      Folder: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>,
      Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>,
      Clock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      CheckCircle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Printer: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>,
      Signature: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>,
      Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
      Truck: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10M13 16h10l-3-7h-7" /></svg>,
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
      AlertTriangle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
      ShieldCheck: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
      Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      UserPlus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" /><circle cx="8.5" cy="7" r="4" strokeWidth="2" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 8v6m3-3h-6" /></svg>
    };

    // Auxiliares de strings e formatação
    const toUpperCase = (str) => {
      if (!str) return "";
      return str.toUpperCase().trim();
    };

    const toTitleCase = (str) => {
      if (!str) return "";
      return str
        .trim()
        .toLowerCase()
        .split(/\s+/)
        .map((word, index) => {
          const prepositions = ["de", "do", "da", "dos", "das", "e", "em", "para", "com"];
          if (index > 0 && prepositions.includes(word)) {
            return word;
          }
          return word.charAt(0).toUpperCase() + word.slice(1);
        })
        .join(' ');
    };

    const getLocalDateString = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const formatDateTimeFull = (dString) => {
      const d = dString ? new Date(dString) : new Date();
      return d.toLocaleString('pt-BR');
    };

    const formatCurrencyBRL = (raw) => {
      const digits = raw.replace(/\D/g, '');
      if (!digits) return '';
      const number = parseInt(digits, 10) / 100;
      return number.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const formatarDataExtenso = (dateString) => {
      if (!dateString) return "";
      try {
        const parts = dateString.split('-');
        if (parts.length !== 3) return dateString;
        const date = new Date(parts[0], parts[1] - 1, parts[2]);
        return date.toLocaleDateString('pt-BR', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
      } catch (e) {
        return dateString;
      }
    };

    function App({ user }) {
      // Documentos sincronizados em tempo real com o Firestore (compartilhados por todos os usuários)
      const [documents, setDocuments] = useState([]);
      const [carregandoDocs, setCarregandoDocs] = useState(true);
      const [erroNuvem, setErroNuvem] = useState("");

      useEffect(() => {
        const cancelar = db.collection(COL_DOCUMENTOS).onSnapshot(
          (snap) => {
            const lista = snap.docs.map(d => ({ ...d.data(), id: d.id }));
            lista.sort((a, b) =>
              (b.criadoEm || '').localeCompare(a.criadoEm || '') ||
              b.id.localeCompare(a.id, undefined, { numeric: true })
            );
            setDocuments(lista);
            setCarregandoDocs(false);
            setErroNuvem("");
          },
          (err) => {
            console.error("Erro ao ler documentos:", err);
            setCarregandoDocs(false);
            setErroNuvem(err.code === 'permission-denied'
              ? "Sem permissão para acessar os dados na nuvem. Confira as regras do Firestore e entre com um e-mail @" + DOMINIO_PERMITIDO + "."
              : "Falha de conexão com a nuvem. Verifique sua internet e recarregue a página.");
          }
        );
        return cancelar;
      }, []);

      // Migração única dos dados que estavam no localStorage deste navegador
      const [dadosLocais, setDadosLocais] = useState(() => lerDadosLocais());
      const [migrando, setMigrando] = useState(false);

      const migrarDadosLocais = async () => {
        if (!dadosLocais) return;
        setMigrando(true);
        try {
          const existentes = new Set(documents.map(d => d.id));
          const novos = dadosLocais.docs.filter(d => !existentes.has(d.id));
          const ignorados = dadosLocais.docs.length - novos.length;
          for (let i = 0; i < novos.length; i += 400) {
            const lote = db.batch();
            novos.slice(i, i + 400).forEach(d => {
              lote.set(db.collection(COL_DOCUMENTOS).doc(d.id), { ...d, migradoPor: user.email });
            });
            await lote.commit();
          }
          for (const [nomeDoc, itensLocais] of Object.entries(dadosLocais.listas)) {
            if (!itensLocais.length) continue;
            const ref = db.collection(COL_CONFIG).doc(nomeDoc);
            const snap = await ref.get();
            const atuais = snap.exists ? (snap.data().itens || []) : [];
            const uniao = Array.from(new Set([...atuais, ...itensLocais])).sort();
            await ref.set({
              itens: uniao,
              atualizadoPor: user.email,
              atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          localStorage.setItem('sadp_migrado_firestore', new Date().toISOString());
          setDadosLocais(null);
          alert(novos.length + " documento(s) e os cadastros foram enviados para a nuvem." +
            (ignorados > 0 ? " " + ignorados + " documento(s) foram ignorados porque já existe um registro com o mesmo ID na nuvem." : ""));
        } catch (err) {
          avisarErroFirestore(err);
        }
        setMigrando(false);
      };

      // Assinaturas digitais não ficam mais num banco separado: cada uma é salva
      // como campo do próprio documento e some junto quando o documento é excluído.
      // Remove de vez qualquer resíduo do antigo banco global de assinaturas.
      useEffect(() => {
        localStorage.removeItem('sadp_digital_signatures');
      }, []);

      // Cadastro de SKUs usado para pré-seleção nas telas de ADM.AT e Avarias
      const [skuList, setSkuList] = useListaSincronizada('skus', user);

      const [cadastroView, setCadastroView] = useState('atual');
      const [novoSkuManual, setNovoSkuManual] = useState('');
      const [skuUploadMsg, setSkuUploadMsg] = useState('');

      const handleAddSkuManual = () => {
        const valor = novoSkuManual.trim().toUpperCase();
        if (!valor) return;
        if (skuList.includes(valor)) {
          setNovoSkuManual('');
          return;
        }
        setSkuList([...skuList, valor].sort());
        setNovoSkuManual('');
      };

      const handleEditSku = (index, novoValor) => {
        setSkuList(skuList.map((s, i) => i === index ? novoValor.toUpperCase() : s));
      };

      const handleDeleteSku = (index) => {
        setSkuList(skuList.filter((_, i) => i !== index));
      };

      const handleSkuFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
            if (!rows.length) {
              setSkuUploadMsg('Planilha vazia.');
              return;
            }
            const header = rows[0].map(h => String(h || '').trim().toLowerCase());
            let skuColIndex = header.indexOf('sku');
            if (skuColIndex === -1) {
              skuColIndex = header.findIndex(h => h.includes('sku'));
            }
            if (skuColIndex === -1) {
              setSkuUploadMsg('Coluna "sku" não encontrada na célula A1. Verifique o título da coluna.');
              return;
            }
            const novosSkus = rows.slice(1)
              .map(row => String(row[skuColIndex] || '').trim().toUpperCase())
              .filter(v => v.length > 0);
            const combinados = Array.from(new Set([...skuList, ...novosSkus])).sort();
            setSkuList(combinados);
            setSkuUploadMsg(`${novosSkus.length} SKU(s) importado(s) da planilha. Total cadastrado: ${combinados.length}.`);
          } catch (err) {
            console.error(err);
            setSkuUploadMsg('Erro ao ler a planilha. Verifique o formato do arquivo.');
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      // Cadastro de Colaboradores usado para pré-seleção nas telas de ADM.AT e Arquivo de Importação
      const [colaboradorList, setColaboradorList] = useListaSincronizada('colaboradores', user);

      const [cadastroColabView, setCadastroColabView] = useState('atual');
      const [novoColaboradorManual, setNovoColaboradorManual] = useState('');
      const [colaboradorUploadMsg, setColaboradorUploadMsg] = useState('');

      const handleAddColaboradorManual = () => {
        const valor = toTitleCase(novoColaboradorManual.trim());
        if (!valor) return;
        if (colaboradorList.includes(valor)) {
          setNovoColaboradorManual('');
          return;
        }
        setColaboradorList([...colaboradorList, valor].sort());
        setNovoColaboradorManual('');
      };

      const handleEditColaborador = (index, novoValor) => {
        setColaboradorList(colaboradorList.map((c, i) => i === index ? novoValor : c));
      };

      const handleDeleteColaborador = (index) => {
        setColaboradorList(colaboradorList.filter((_, i) => i !== index));
      };

      const handleColaboradorFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
            if (!rows.length) {
              setColaboradorUploadMsg('Planilha vazia.');
              return;
            }
            const header = rows[0].map(h => String(h || '').trim().toLowerCase());
            let colColIndex = header.findIndex(h => h.includes('colaborador') || h.includes('nome'));
            if (colColIndex === -1) {
              setColaboradorUploadMsg('Coluna "colaborador" (ou "nome") não encontrada na célula A1. Verifique o título da coluna.');
              return;
            }
            const novosColaboradores = rows.slice(1)
              .map(row => toTitleCase(String(row[colColIndex] || '').trim()))
              .filter(v => v.length > 0);

      // IDs sequenciais gerados por um contador no Firestore (transação), evitando IDs repetidos entre usuários
      const getNextSequentialId = async (prefix, type) => {
        const regex = new RegExp(`^${prefix}-(\\d+)$`);
        const maiorLocal = documents
          .filter(d => d.type === type)
          .reduce((max, d) => {
            const match = d.id.match(regex);
            if (!match) return max;
            const num = parseInt(match[1], 10);
            return num > max ? num : max;
          }, 0);
        const refContadores = db.collection(COL_CONFIG).doc('contadores');
        return db.runTransaction(async (tx) => {
          const snap = await tx.get(refContadores);
          const atual = snap.exists ? (snap.data()[prefix] || 0) : 0;
          const proximo = Math.max(atual, maiorLocal) + 1;
          tx.set(refContadores, { [prefix]: proximo }, { merge: true });
          return `${prefix}-${String(proximo).padStart(4, '0')}`;
        });
      };

          await db.collection(COL_DOCUMENTOS).doc(completo.id).set(completo);

          setDocuments(prev => prev.filter(d => d.id !== completo.id));

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }
        
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      };

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const coords = getCoordinates(e);
        
        ctx.beginPath();
        ctx.moveTo(coords.x, coords.y);
        setIsDrawing(true);
        if (e.cancelable) e.preventDefault(); 
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const coords = getCoordinates(e);
        
        ctx.lineTo(coords.x, coords.y);
        ctx.strokeStyle = '#0f172a'; 
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        if (e.cancelable) e.preventDefault();
      };

          responsavelEntrega: "",
          nomeRetirada: "",
          documentoRetirada: "",
          setorRetirada: "",
          itemDescricao: selectedDoc?.descricao || "",
          dataRetirada: getLocalDateString(),
          emailRetirada: ""
        });
        setIsImportRetiradaModalOpen(true);
      };

      const submitFichaSign = (e) => {
        e.preventDefault();
        const agora = new Date().toISOString();
        const docAtual = documents.find(d => d.id === selectedDocId);
        if (!docAtual) return;
        atualizarDocumento(selectedDocId, {
          status: 'entregue',
          assinadoRetirado: toTitleCase(fichaSignForm.confirmadoRetirado),
          assinadoAprovado: toTitleCase(fichaSignForm.confirmadoAprovado),
          devolvidoPor: toTitleCase(fichaSignForm.confirmadoDevolvido),
          recebidoPor: toTitleCase(fichaSignForm.confirmadoRecebido),
          assinadoDevolvido: toTitleCase(fichaSignForm.confirmadoDevolvido),
          assinadoRecebido: toTitleCase(fichaSignForm.confirmadoRecebido),
          dataFinalizacao: getLocalDateString(),
          dataHoraRetirada: fichaSignForm.confirmadoRetirado ? agora : (docAtual.dataHoraRetirada || ""),
          dataHoraAprovado: fichaSignForm.confirmadoAprovado ? agora : (docAtual.dataHoraAprovado || ""),
          dataHoraDevolvido: fichaSignForm.confirmadoDevolvido ? agora : (docAtual.dataHoraDevolvido || ""),
          dataHoraRecebido: fichaSignForm.confirmadoRecebido ? agora : (docAtual.dataHoraRecebido || "")
        });
        setIsFichaSignModalOpen(false);
        setActiveMenu('ficha-entregue');
      };

      const submitImportRetirada = (e) => {
        e.preventDefault();
        const nomeEntrega = toTitleCase(importRetiradaForm.responsavelEntrega);
        const nomeRetirante = toTitleCase(importRetiradaForm.nomeRetirada);
        atualizarDocumento(selectedDocId, {
          status: 'entregue',
          responsavelEntrega: nomeEntrega,
          nomeRetirada: nomeRetirante,
          documentoRetirada: toUpperCase(importRetiradaForm.documentoRetirada),
          setorRetirada: toTitleCase(importRetiradaForm.setorRetirada),
          itemDescricao: toTitleCase(importRetiradaForm.itemDescricao),
          dataRetirada: importRetiradaForm.dataRetirada,
          emailRetirada: importRetiradaForm.emailRetirada.trim().toLowerCase(),
          dataHoraConfirmacaoRetirada: new Date().toISOString()
        });
        setIsImportRetiradaModalOpen(false);
        setActiveMenu('import-entregue');

        const fila = [
          { role: 'entrega', nome: nomeEntrega },
          { role: 'retirada', nome: nomeRetirante }
        ];
        setIsMandatorySign(true);
        setMandatorySignQueue(fila.slice(1));
        handleOpenDigitalSign(fila[0].role, fila[0].nome);
      };

      const handleUpdateObservacao = (id, texto) => {
        setObsInput(texto);
        clearTimeout(obsTimer.current);
        obsTimer.current = setTimeout(() => {
          db.collection(COL_DOCUMENTOS).doc(id).set({ observacaoInterna: texto }, { merge: true }).catch(avisarErroFirestore);
        }, 700);
      };

      const handleUpdateLocalizacao = (id, novaLocalizacao, responsavelMovimentacao) => {
        const valor = toTitleCase(novaLocalizacao.trim());
        const responsavel = (responsavelMovimentacao || "").trim();
        if (!valor || !responsavel) return;
        const docAtual = documents.find(d => d.id === id);
        if (!docAtual) return;
        const anterior = docAtual.localizacaoArmazenamento || "";
        if (anterior === valor) return;
        const historico = [...(docAtual.localizacaoHistorico || []), {
          de: anterior,
          para: valor,
          responsavel: responsavel,
          dataHora: new Date().toISOString()
        }];
        atualizarDocumento(id, { localizacaoArmazenamento: valor, localizacaoHistorico: historico });
      };

      const handleDelete = (id) => {
        const target = documents.find(d => d.id === id);
        if (target && target.type === 'IMPORTACAO') return;
        setDeleteConfirmId(id);
      };

      const executeDelete = () => {
        const idToDelete = deleteConfirmId;
        const target = documents.find(d => d.id === idToDelete);
        if (target && target.type === 'IMPORTACAO') {
          setDeleteConfirmId(null);
          return;
        }
        db.collection(COL_DOCUMENTOS).doc(idToDelete).delete().catch(avisarErroFirestore);
        setDocuments(prev => prev.filter(d => d.id !== idToDelete));
        setDeleteConfirmId(null);
        setSelectedDocId(null);
      };

      const getFiltroDocumentos = () => {
        let typeFilter = "";
        let statusFilter = "entregue";

        if (activeMenu.startsWith('ficha-')) {
          typeFilter = "FICHA";
          statusFilter = activeMenu.replace('ficha-', '');
        } else if (activeMenu.startsWith('import-')) {
          typeFilter = "IMPORTACAO";
          statusFilter = activeMenu.replace('import-', '');
        } else if (activeMenu.startsWith('avaria-zeus-')) {
          typeFilter = "AVARIA_ZEUS";
          const sub = activeMenu.replace('avaria-zeus-', '');
          statusFilter = sub === 'lista' ? 'entregue' : sub;
        } else if (activeMenu.startsWith('avaria-transp-')) {
          typeFilter = "AVARIA_TRANSP";
          const sub = activeMenu.replace('avaria-transp-', '');
          statusFilter = sub === 'lista' ? 'entregue' : sub;
        }

        return documents.filter(doc => {
          if (doc.type !== typeFilter || doc.status !== statusFilter) return false;
          const search = searchTerm.toLowerCase();
          return (
            doc.id.toLowerCase().includes(search) ||
            (doc.sku && doc.sku.toLowerCase().includes(search)) ||
            (doc.nomeAvaria && doc.nomeAvaria.toLowerCase().includes(search)) ||
            (doc.solicitante && doc.solicitante.toLowerCase().includes(search)) ||
            (doc.nomeRetirada && doc.nomeRetirada.toLowerCase().includes(search)) ||
            (doc.descricao && doc.descricao.toLowerCase().includes(search)) ||
            (doc.container && doc.container.toLowerCase().includes(search))
          );
        });
      };

      useEffect(() => {
        const list = getFiltroDocumentos();
        if (list.length > 0) {
          if (!list.some(doc => doc.id === selectedDocId)) {
            setSelectedDocId(list[0].id);
          }
        } else {
          setSelectedDocId(null);
        }
      }, [activeMenu, searchTerm, documents]);

      const countFichasPendentes = documents.filter(d => d.type === 'FICHA' && d.status === 'pendente').length;
      const countImportPendentes = documents.filter(d => d.type === 'IMPORTACAO' && d.status === 'pendente').length;
      const countAvariasZeus = documents.filter(d => d.type === 'AVARIA_ZEUS').length;
      const countAvariasTransp = documents.filter(d => d.type === 'AVARIA_TRANSP').length;

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col text-slate-800 font-sans antialiased print:bg-white print:p-0">
          
          {/* Barra de Topo Principal */}
          <header className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between shadow-md print:hidden">
            <div className="flex items-center space-x-3">
              <button 
                onClick={() => setIsMobileSidebarOpen(!isMobileSidebarOpen)} 
                className="lg:hidden text-white hover:text-slate-200 focus:outline-none p-1 mr-2"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
              
              <div className="bg-indigo-600 p-2 rounded-lg hidden sm:block">
                <Icons.Folder />
              </div>
              <div>
                <p className="text-xs text-slate-400">Sistema de Armazenamento de Documentos Padrão</p>
              </div>
            </div>
            <div className="flex items-center space-x-4">
              <span className="text-xs sm:text-sm bg-slate-800 text-slate-300 px-3 py-1 rounded-full font-mono border border-slate-700">
                index.com / ADM.AT & Logística
              </span>
              <div className="hidden sm:flex items-center space-x-2 text-xs text-slate-300">
                {user.photoURL && <img src={user.photoURL} alt="" referrerPolicy="no-referrer" className="w-7 h-7 rounded-full border border-slate-600" />}
                <span className="max-w-[180px] truncate" title={user.email}>{user.displayName || user.email}</span>
              </div>
              <button
                onClick={() => auth.signOut()}
                className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 font-semibold"
              >
                Sair
              </button>
            </div>
          </header>

          {erroNuvem && (
            <div className="bg-red-600 text-white text-xs px-6 py-2 print:hidden">{erroNuvem}</div>
          )}

          {dadosLocais && (
            <div className="bg-amber-100 border-b border-amber-300 text-amber-900 text-xs px-6 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 print:hidden">
              <span>
                <strong>Dados antigos neste navegador:</strong> há {dadosLocais.docs.length} documento(s) e cadastros salvos localmente.
                Envie para a nuvem para que todos os usuários possam vê-los.
              </span>
              <div className="flex gap-2">
                <button
                  onClick={migrarDadosLocais}
                  disabled={migrando || carregandoDocs}
                  className="bg-amber-600 hover:bg-amber-700 disabled:bg-slate-300 text-white font-bold px-3 py-1.5 rounded-lg"
                >
                  {migrando ? 'Enviando...' : 'Enviar para a nuvem'}
                </button>
                <button
                  onClick={() => { localStorage.setItem('sadp_migrado_firestore', 'dispensado'); setDadosLocais(null); }}
                  className="bg-white hover:bg-amber-50 border border-amber-300 text-amber-800 font-bold px-3 py-1.5 rounded-lg"
                >
                  Dispensar
                </button>
              </div>
            </div>
          )}

          {/* Layout Base */}
          <div className="flex flex-1 relative print:block">
            
            {isMobileSidebarOpen && (
              <div 
                onClick={() => setIsMobileSidebarOpen(false)} 
                className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-30 lg:hidden"
              />
            )}

            {/* Menu Lateral de Navegação */}
            <aside className={`
              fixed inset-y-0 left-0 z-40 w-80 bg-slate-800 text-slate-300 flex flex-col border-r border-slate-700 shadow-xl transition-transform duration-300 transform
              lg:static lg:translate-x-0
              ${isMobileSidebarOpen ? 'translate-x-0' : '-translate-x-full'}
              print:hidden
            `}>
              <div className="p-4 border-b border-slate-700 flex justify-between items-center">
                <h2 className="text-xs uppercase font-semibold text-slate-400 tracking-wider">Aba Lateral Documentos</h2>
                <button className="lg:hidden text-slate-400 hover:text-white" onClick={() => setIsMobileSidebarOpen(false)}>✕</button>
              </div>

              <nav className="flex-1 overflow-y-auto p-4 space-y-4">
                
                {/* ACORDEÃO 1: ADM.AT */}
                <div className="rounded-xl bg-slate-900 overflow-hidden border border-slate-700/60 shadow-sm">
                  <button 
                    onClick={() => setIsAdmAtOpen(!isAdmAtOpen)}
                    className="w-full flex items-center justify-between px-4 py-3 bg-slate-950 text-white font-bold hover:bg-slate-900 transition-all focus:outline-none"
                  >
                    <div className="flex items-center space-x-2.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                      <span>ADM.AT</span>
                    </div>
                    <span>{isAdmAtOpen ? <Icons.ChevronUp /> : <Icons.ChevronDown />}</span>
                  </button>

                  {isAdmAtOpen && (
                    <div className="bg-slate-900/30 p-2 space-y-1 border-t border-slate-800">
                      <button 
                        onClick={() => { setActiveMenu('ficha-criar'); setIsMobileSidebarOpen(false); }}
                        className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                          activeMenu === 'ficha-criar' ? 'bg-indigo-600 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        <Icons.Plus />
                        <span>Criar Novo Documento</span>
                      </button>

                      <button 
                        onClick={() => { setActiveMenu('ficha-pendente'); setIsMobileSidebarOpen(false); }}
                        className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                          activeMenu === 'ficha-pendente' ? 'bg-amber-600 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        <div className="flex items-center space-x-3">
                          <Icons.Clock />
                          <span>Documentos Pendentes</span>
                        </div>
                        {countFichasPendentes > 0 && (
                          <span className="bg-amber-500/20 text-amber-300 px-2 py-0.5 text-[10px] rounded-full font-bold">
                            {countFichasPendentes}
                          </span>
                        )}
                      </button>

                      <button
                        onClick={() => { setActiveMenu('ficha-entregue'); setIsMobileSidebarOpen(false); }}
                        className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                          activeMenu === 'ficha-entregue' ? 'bg-emerald-600 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        <Icons.CheckCircle />
                        <span>Documentos Entregues</span>
                      </button>

                      <button
                        onClick={() => { setActiveMenu('ficha-guia'); setIsMobileSidebarOpen(false); }}
                        className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                          activeMenu === 'ficha-guia' ? 'bg-slate-600 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        <Icons.FileText />
                        <span>Passo a Passo</span>
                      </button>
                    </div>
                  )}
                </div>

                {/* ACORDEÃO 2: ARQUIVO DE IMPORTAÇÃO */}
                <div className="rounded-xl bg-slate-900 overflow-hidden border border-slate-700/60 shadow-sm">
                  <button 
                    onClick={() => setIsImportOpen(!isImportOpen)}
                    className="w-full flex items-center justify-between px-4 py-3 bg-slate-950 text-white font-bold hover:bg-slate-900 transition-all focus:outline-none"
                  >
                    <div className="flex items-center space-x-2.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-teal-500"></span>
                      <span>Arquivo de Importação</span>
                    </div>
                    <span>{isImportOpen ? <Icons.ChevronUp /> : <Icons.ChevronDown />}</span>
                  </button>

                  {isImportOpen && (
                    <div className="bg-slate-900/30 p-2 space-y-1 border-t border-slate-800">
                      <button 
                        onClick={() => { setActiveMenu('import-criar'); setIsMobileSidebarOpen(false); }}
                        className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                          activeMenu === 'import-criar' ? 'bg-teal-600 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        <Icons.Plus />
                        <span>Criar Registro Chegada</span>
                      </button>

                      <button 
                        onClick={() => { setActiveMenu('import-pendente'); setIsMobileSidebarOpen(false); }}
                        className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                          activeMenu === 'import-pendente' ? 'bg-amber-600 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        <div className="flex items-center space-x-3">
                          <Icons.Clock />
                          <span>Documentos Pendentes</span>
                        </div>
                        {countImportPendentes > 0 && (
                          <span className="bg-amber-500/20 text-amber-300 px-2 py-0.5 text-[10px] rounded-full font-bold">
                            {countImportPendentes}
                          </span>
                        )}
                      </button>

                      <button
                        onClick={() => { setActiveMenu('import-entregue'); setIsMobileSidebarOpen(false); }}
                        className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                          activeMenu === 'import-entregue' ? 'bg-emerald-600 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        <Icons.CheckCircle />
                        <span>Entregues / Assinados</span>
                      </button>

                      <button
                        onClick={() => { setActiveMenu('import-guia'); setIsMobileSidebarOpen(false); }}
                        className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                          activeMenu === 'import-guia' ? 'bg-slate-600 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                        }`}
                      >
                        <Icons.FileText />
                        <span>Passo a Passo</span>
                      </button>
                    </div>
                  )}
                </div>

                {/* ACORDEÃO 3: NOVO REGISTRO DE AVARIAS */}
                <div className="rounded-xl bg-slate-900 overflow-hidden border border-slate-700/60 shadow-sm">
                  <button 
                    onClick={() => setIsAvariasOpen(!isAvariasOpen)}
                    className="w-full flex items-center justify-between px-4 py-3 bg-slate-950 text-white font-bold hover:bg-slate-900 transition-all focus:outline-none"
                  >
                    <div className="flex items-center space-x-2.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                      <span>Avarias Registradas</span>
                    </div>
                    <span>{isAvariasOpen ? <Icons.ChevronUp /> : <Icons.ChevronDown />}</span>
                  </button>

                  {isAvariasOpen && (
                    <div className="bg-slate-900/30 p-2 space-y-2 border-t border-slate-800">
                      
                      {/* CATEGORIA 1: AVARIA ZEUS */}
                      <div className="border border-slate-800 rounded-lg p-1.5 bg-slate-950/20">
                        <p className="text-[10px] text-slate-500 font-extrabold uppercase px-2 mb-1 tracking-wider">Avaria ZEUS (Tubrax)</p>
                        <button 
                          onClick={() => { setActiveMenu('avaria-zeus-criar'); setIsMobileSidebarOpen(false); }}
                          className={`w-full flex items-center space-x-2 px-2 py-1.5 rounded text-[11px] font-semibold transition-all ${
                            activeMenu === 'avaria-zeus-criar' ? 'bg-red-800 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          <Icons.Plus />
                          <span>Gerar Termo Zeus</span>
                        </button>
                        <button 
                          onClick={() => { setActiveMenu('avaria-zeus-lista'); setIsMobileSidebarOpen(false); }}
                          className={`w-full flex items-center justify-between px-2 py-1.5 rounded text-[11px] font-semibold transition-all ${
                            activeMenu === 'avaria-zeus-lista' ? 'bg-slate-700 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          <div className="flex items-center space-x-2">
                            <Icons.FileText />
                            <span>Ver Termos Zeus</span>
                          </div>
                          {countAvariasZeus > 0 && <span className="bg-slate-800 text-slate-300 px-1.5 py-0.2 text-[9px] rounded-full">{countAvariasZeus}</span>}
                        </button>
                        <button
                          onClick={() => { setActiveMenu('avaria-zeus-guia'); setIsMobileSidebarOpen(false); }}
                          className={`w-full flex items-center space-x-2 px-2 py-1.5 rounded text-[11px] font-semibold transition-all ${
                            activeMenu === 'avaria-zeus-guia' ? 'bg-slate-700 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          <Icons.FileText />
                          <span>Passo a Passo</span>
                        </button>
                      </div>

                      {/* CATEGORIA 2: AVARIA TRANSPORTADORA */}
                      <div className="border border-slate-800 rounded-lg p-1.5 bg-slate-950/20">
                        <p className="text-[10px] text-slate-500 font-extrabold uppercase px-2 mb-1 tracking-wider">Avaria Transportadora</p>
                        <button 
                          onClick={() => { setActiveMenu('avaria-transp-criar'); setIsMobileSidebarOpen(false); }}
                          className={`w-full flex items-center space-x-2 px-2 py-1.5 rounded text-[11px] font-semibold transition-all ${
                            activeMenu === 'avaria-transp-criar' ? 'bg-red-800 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          <Icons.Plus />
                          <span>Gerar Termo Transp</span>
                        </button>
                        <button 
                          onClick={() => { setActiveMenu('avaria-transp-lista'); setIsMobileSidebarOpen(false); }}
                          className={`w-full flex items-center justify-between px-2 py-1.5 rounded text-[11px] font-semibold transition-all ${
                            activeMenu === 'avaria-transp-lista' ? 'bg-slate-700 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          <div className="flex items-center space-x-2">
                            <Icons.Truck />
                            <span>Ver Termos Transp</span>
                          </div>
                          {countAvariasTransp > 0 && <span className="bg-slate-800 text-slate-300 px-1.5 py-0.2 text-[9px] rounded-full">{countAvariasTransp}</span>}
                        </button>
                        <button
                          onClick={() => { setActiveMenu('avaria-transp-guia'); setIsMobileSidebarOpen(false); }}
                          className={`w-full flex items-center space-x-2 px-2 py-1.5 rounded text-[11px] font-semibold transition-all ${
                            activeMenu === 'avaria-transp-guia' ? 'bg-slate-700 text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          <Icons.FileText />
                          <span>Passo a Passo</span>
                        </button>
                      </div>

                    </div>
                  )}
                </div>

                {/* ACORDEÃO 4: OPÇÕES */}
                <div className="rounded-xl bg-slate-900 overflow-hidden border border-slate-700/60 shadow-sm">
                  <button
                    onClick={() => setIsOpcoesOpen(!isOpcoesOpen)}
                    className="w-full flex items-center justify-between px-4 py-3 bg-slate-950 text-white font-bold hover:bg-slate-900 transition-all focus:outline-none"
                  >
                    <div className="flex items-center space-x-2.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                      <span>Opções</span>
                    </div>
                    <span>{isOpcoesOpen ? <Icons.ChevronUp /> : <Icons.ChevronDown />}</span>
                  </button>

                  {isOpcoesOpen && (
                    <div className="bg-slate-900/30 p-2 space-y-2 border-t border-slate-800">

                      {/* SUBSEÇÃO: CADASTRO (novas abas de cadastro entram aqui dentro) */}
                      <div className="border border-slate-800 rounded-lg bg-slate-950/20 overflow-hidden">
                        <button
                          onClick={() => setIsCadastroSubOpen(!isCadastroSubOpen)}
                          className="w-full flex items-center justify-between px-2.5 py-2 text-[10px] font-extrabold uppercase text-slate-500 hover:text-white tracking-wider transition-all"
                        >
                          <span>Cadastro</span>
                          <span>{isCadastroSubOpen ? <Icons.ChevronUp /> : <Icons.ChevronDown />}</span>
                        </button>

                        {isCadastroSubOpen && (
                          <div className="p-1.5 pt-0 space-y-1">
                            <button

                      </div>
                      <ol className="p-6 space-y-4 list-none">

                          "Clique em \"Criar Novo Documento\" e preencha SKU, quantidade, setor solicitante, solicitante, finalidade e data de entrada.",

                          "Ao gerar o documento, o pad de assinatura digital abre automaticamente para colher a assinatura de quem vai retirar.",

                          "Quando o item for devolvido/recebido, abra o documento pendente e clique em \"Preencher Recebido/Devolvido e Colher Assinaturas\".",

                          "Use \"Imprimir Folha A4\" para gerar o documento final com o logo Grupo TBX, assinaturas digitais e espaço para assinatura física.",

                            <select required value={fichaForm.retiradoPor} onChange={e => setFichaForm({...fichaForm, retiradoPor: e.target.value})} className="w-full p-2.5 rounded-lg border text-sm bg-white capitalize">
                              <option value="">Selecione o colaborador</option>
                              {colaboradorList.map(c => <option key={c} value={c}>{c}</option>)}

                          </div>
                          <div>
                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Aprovado por *</label>

                              <option value="">Selecione o colaborador</option>
                              {colaboradorList.map(c => <option key={c} value={c}>{c}</option>)}

    // Porta de entrada: só renderiza o sistema para usuários Google com e-mail do domínio permitido
    function AuthGate() {
      const [user, setUser] = useState(null);
      const [verificando, setVerificando] = useState(true);
      const [entrando, setEntrando] = useState(false);
      const [erro, setErro] = useState("");

      useEffect(() => {
        const cancelar = auth.onAuthStateChanged(async (u) => {
          if (!u) {
            setUser(null);
            setVerificando(false);
            return;
          }
          if (emailPermitido(u)) {
            setErro("");
            setUser(u);
          } else {
            setUser(null);
            setErro("A conta " + u.email + " não tem acesso. Entre com um e-mail @" + DOMINIO_PERMITIDO + ".");
            await auth.signOut();
          }
          setVerificando(false);
        });
        return cancelar;
      }, []);

      const entrar = async () => {
        setErro("");
        setEntrando(true);
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ hd: DOMINIO_PERMITIDO, prompt: 'select_account' });
          await auth.signInWithPopup(provider);
        } catch (err) {
          console.error(err);
          if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
            // usuário fechou a janela: nada a mostrar
          } else if (err.code === 'auth/popup-blocked') {
            setErro("O navegador bloqueou a janela de login. Libere os pop-ups para este site e tente de novo.");
          } else if (err.code === 'auth/unauthorized-domain') {
            setErro("Este endereço não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).");
          } else if (err.code === 'auth/operation-not-supported-in-this-environment') {
            setErro("Abra o sistema por um endereço http(s) (por exemplo, o do GitHub Pages), não direto do arquivo no computador.");
          } else {
            setErro(err.message || "Não foi possível entrar. Tente novamente.");
          }
        }
        setEntrando(false);
      };

      if (verificando) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center text-slate-300 text-sm">
            Verificando acesso...
          </div>
        );
      }

      if (!user) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
              <div className="bg-slate-950 text-white px-6 py-7 text-center">
                <div className="flex items-center justify-center gap-3 mb-3">
                  <span className="font-sans text-sm tracking-[0.25em] text-slate-400 uppercase">Grupo</span>
                  <span className="w-[3px] h-6 bg-red-600 inline-block"></span>
                  <span className="font-sans text-2xl font-black tracking-tight">TBX</span>
                </div>
                <h1 className="text-lg font-bold">Portal SADP</h1>
                <p className="text-xs text-slate-400 mt-1">Sistema de Armazenamento de Documentos Padrão</p>
              </div>
              <div className="p-6 space-y-4">
                <p className="text-sm text-slate-600 text-center">
                  Acesso restrito a colaboradores com e-mail <strong>@{DOMINIO_PERMITIDO}</strong>.
                </p>
                {erro && (
                  <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-3 leading-relaxed">{erro}</div>
                )}
                {window.location.protocol === 'file:' && (
                  <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg p-3 leading-relaxed">
                    O login com Google não funciona abrindo o arquivo direto do computador. Acesse pelo endereço publicado (GitHub Pages).
                  </div>
                )}
                <button
                  onClick={entrar}
                  disabled={entrando}
                  className="w-full flex items-center justify-center gap-3 border border-slate-300 hover:bg-slate-50 rounded-xl py-3 text-sm font-bold text-slate-700 disabled:opacity-60 transition-all"
                >
                  <svg className="w-5 h-5" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
